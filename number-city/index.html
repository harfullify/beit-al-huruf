<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2F6FD6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Number City</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Layout: one-screen tablet game. A sunny Dubai sky, big rounded tap targets, one screen at a time. Deliberately single (light) theme: a daytime play world. */
:root{
  --sky:#CDE9F6; --sky-hi:#EEF8FC; --sand:#EFD9A8; --sand-deep:#D6B477;
  --ink:#1D2944; --ink-soft:#56627F; --paper:#FFFDF7; --line:#CFDDEA; --soft:#E8F1F8;
  --gold:#F4B23A; --gold-deep:#B97A0A; --good:#2E9E4F;
  --me:#2F6FD6; --me-soft:#E3ECFB; --me-dark:#1F4FA6;
  --f-big:"Fredoka","Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --f-read:"Andika","Trebuchet MS",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:linear-gradient(180deg,var(--sky-hi) 0%,var(--sky) 100%);background-color:var(--sky);color:var(--ink);font-family:var(--f-read);font-size:18px;line-height:1.35;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;overflow-x:hidden}
input,select{user-select:text;-webkit-user-select:text}
#app{box-sizing:border-box;min-height:100%;max-width:1100px;margin:0 auto;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 22px}
.screen{flex:1;display:flex;flex-direction:column;gap:16px;min-height:0}
.center{align-items:center;justify-content:center;text-align:center}
h1,h2,h3{font-family:var(--f-big);font-weight:700;margin:0;text-wrap:balance;letter-spacing:.2px}
h1{font-size:clamp(34px,6vw,58px);line-height:1.05}
h2{font-size:clamp(24px,4vw,36px)}
h3{font-size:22px}
p{margin:0}
.soft{color:var(--ink-soft)}
.label{font-family:var(--f-big);font-weight:600;font-size:14px;letter-spacing:1.4px;text-transform:uppercase;color:var(--ink-soft)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation}
button:focus-visible,select:focus-visible,input:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
.btn{font-family:var(--f-big);font-weight:600;font-size:clamp(22px,3.4vw,30px);background:var(--me);color:#fff;border-radius:22px;padding:14px 28px;box-shadow:0 6px 0 var(--me-dark);transition:transform .08s,box-shadow .08s;display:inline-flex;align-items:center;justify-content:center;gap:10px}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--me-dark)}
.btn.quiet{background:var(--paper);color:var(--ink);box-shadow:0 4px 0 var(--line);font-size:20px;padding:10px 18px;border-radius:18px}
.btn.gold{background:var(--gold);color:var(--ink);box-shadow:0 6px 0 var(--gold-deep)}
.btn.huge{font-size:clamp(34px,6vw,54px);padding:18px 48px;border-radius:30px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.danger{color:#B4232A}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

/* who's playing */
.brand{display:flex;flex-direction:column;gap:4px}
.brand h1{color:var(--ink)} .brand h1 span{color:var(--gold-deep)}
.sub{font-size:24px;color:var(--ink-soft)}
.kids{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:18px;width:100%;max-width:900px}
.kid{background:var(--paper);border-radius:28px;border:5px solid var(--c);padding:18px 12px 14px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 8px 0 rgba(29,41,68,.12)}
.kid:active{transform:translateY(4px)}
.avbig{width:140px;height:140px;border-radius:50%;display:block;overflow:hidden}
.avbig svg,.mini-av svg{width:100%;height:100%;display:block}
.kid .nm{font-family:var(--f-big);font-size:32px;font-weight:700;color:var(--c)}
.kid small{font-size:16px;color:var(--ink-soft)}

/* top bar */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.mini-av{width:58px;height:58px;border-radius:50%;background:var(--me-soft);border:3px solid var(--me);overflow:hidden;flex:none}
.who{font-family:var(--f-big);font-size:28px;font-weight:700;color:var(--me)}
.bar{flex:1;min-width:150px;max-width:440px;height:32px;border-radius:16px;background:var(--paper);border:3px solid var(--line);position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--gold),#FFD36E);transition:width .6s}
.bar b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-big);font-size:17px;font-weight:600;color:var(--ink)}

/* home */
.home{display:grid;grid-template-columns:1.5fr 1fr;gap:18px;align-items:start}
@media (max-width:760px){.home{grid-template-columns:1fr}}
.panel{background:var(--paper);border-radius:26px;padding:16px;box-shadow:0 6px 0 rgba(29,41,68,.08);display:flex;flex-direction:column;gap:12px;min-width:0}
.side{display:flex;flex-direction:column;gap:14px;align-items:stretch;text-align:center}

/* scenes */
.scene{position:relative;width:100%;max-width:100%;aspect-ratio:3/2;border-radius:20px;overflow:hidden;container-type:inline-size;background:var(--sky)}
.scene>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.pc{position:absolute;transform:translate(-50%,-100%);line-height:1;font-size:var(--s,7cqw);white-space:nowrap}
.pc svg{display:block;width:auto}
.pc.new{animation:popin .8s cubic-bezier(.3,1.4,.6,1) both}
.newpc{animation:drop .8s cubic-bezier(.3,1.4,.6,1) both;transform-box:fill-box;transform-origin:center}
@keyframes popin{from{transform:translate(-50%,-100%) scale(.2);opacity:0}}
@keyframes drop{from{transform:translateY(-26px);opacity:0}}

/* round */
.q-top{display:flex;align-items:center;gap:12px}
.dots{display:flex;gap:7px;flex:1;justify-content:center;flex-wrap:wrap}
.dots i{width:15px;height:15px;border-radius:50%;background:var(--paper);border:2px solid var(--line)}
.dots i.done{background:var(--gold);border-color:var(--gold-deep)}
.dots i.now{border-color:var(--me);background:var(--me-soft);transform:scale(1.3)}
.starcount{font-family:var(--f-big);font-size:30px;font-weight:700;color:var(--gold-deep);display:flex;gap:6px;align-items:center;font-variant-numeric:tabular-nums}
.starcount.bump{animation:pop .45s}
.prompt{display:flex;align-items:center;justify-content:center;gap:14px;font-size:clamp(22px,3.6vw,34px);font-weight:700;text-align:center;text-wrap:balance}
.say{width:58px;height:58px;border-radius:50%;background:var(--me);color:#fff;flex:none;display:grid;place-items:center;box-shadow:0 4px 0 var(--me-dark)}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;min-height:230px;background:var(--paper);border-radius:28px;padding:18px 12px;position:relative;overflow:hidden;box-shadow:0 6px 0 rgba(29,41,68,.08)}
.choices{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.ch{min-width:100px;min-height:100px;padding:8px 18px;font-family:var(--f-big);font-weight:600;font-size:clamp(38px,6.5vw,60px);color:var(--ink);background:var(--paper);border:4px solid var(--line);border-radius:26px;box-shadow:0 6px 0 var(--line);display:grid;place-items:center;transition:transform .1s,opacity .25s}
.ch:active{transform:translateY(3px)}
.ch.txt{font-size:clamp(22px,3.4vw,30px);padding:10px 22px}
.ch.pic{padding:12px}
.ch.jumbo{min-width:150px;min-height:130px;font-size:clamp(58px,10vw,100px)}
.ch.right{background:var(--good);border-color:var(--good);color:#fff;box-shadow:0 6px 0 #1E6E36;animation:pop .4s}
.ch.wrong{opacity:.28;animation:shake .35s;pointer-events:none}
.ch.show{border-color:var(--good);box-shadow:0 0 0 7px rgba(46,158,79,.35);animation:pop .5s 2}
@keyframes pop{50%{transform:scale(1.14)}}
@keyframes shake{25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}
.cover{position:absolute;inset:0;display:grid;place-items:center;background:var(--soft);font-family:var(--f-big);font-size:30px;font-weight:600;color:var(--ink-soft);border-radius:28px;padding:16px}
.hintline{font-size:20px;color:var(--ink-soft);text-align:center;max-width:36ch}
.big-sum{font-family:var(--f-big);font-weight:700;font-size:clamp(54px,11vw,108px);letter-spacing:2px;line-height:1.1;white-space:nowrap}
.word{font-family:var(--f-big);font-weight:700;font-size:clamp(50px,10vw,96px);color:var(--me)}
.grp{display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:center}
.op{font-family:var(--f-big);font-size:54px;font-weight:700;color:var(--ink-soft)}

/* objects */
.objs{display:grid;gap:8px 10px;justify-content:center}
.ob{position:relative;line-height:1.1;text-align:center}
.ob.gone{opacity:.3}
.ob.gone::after{content:"";position:absolute;left:8%;right:8%;top:48%;height:6px;background:#D2453B;border-radius:3px;transform:rotate(-32deg)}
.ob .n{position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);font-family:var(--f-big);font-size:17px;line-height:1.3;background:var(--gold);color:var(--ink);border-radius:9px;padding:0 6px;font-weight:600;z-index:1}

/* dice + ten frame */
.dice{width:170px;height:170px;background:#fff;border:5px solid var(--ink);border-radius:30px;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:14px;box-sizing:border-box;gap:4px}
.dice i{border-radius:50%;background:var(--ink);margin:5px}
.dice i.e{background:none}
.tf{display:grid;grid-template-columns:repeat(5,min(62px,15vw));grid-auto-rows:min(62px,15vw);border:4px solid var(--ink);border-radius:10px;overflow:hidden;background:#fff}
.tf i{border:2px solid var(--line);display:grid;place-items:center;position:relative;font-style:normal}
.tf i.f::after{content:"";position:absolute;inset:14%;border-radius:50%;background:#D2453B}
.tf b{position:relative;z-index:1;color:#fff;font-family:var(--f-big);font-size:22px}

/* towers, trains, patterns, number line */
.tower{display:flex;flex-direction:column-reverse;gap:4px;padding:6px;border:4px solid var(--ink);border-radius:12px;background:#fff}
.tower i{width:72px;height:min(28px,4.2vh);min-height:22px;border-radius:7px;border:2px dashed var(--line);display:grid;place-items:center;font-family:var(--f-big);font-size:16px;font-style:normal;color:var(--ink-soft)}
.tower i.f{background:var(--me);border:2px solid var(--me-dark)}
.tag{font-family:var(--f-big);font-size:30px;font-weight:700;background:var(--gold);color:var(--ink);padding:6px 16px;border-radius:12px}
.train{display:flex;align-items:flex-end;gap:6px;flex-wrap:wrap;justify-content:center}
.engine{font-size:70px;line-height:1;margin-bottom:8px}
.car{min-width:84px;height:70px;padding:0 6px;box-sizing:border-box;background:var(--me);border-radius:12px 12px 6px 6px;display:grid;place-items:center;font-family:var(--f-big);font-size:36px;font-weight:700;color:#fff;position:relative;margin-bottom:16px}
.car::before,.car::after{content:"";position:absolute;bottom:-15px;width:20px;height:20px;border-radius:50%;background:var(--ink);border:4px solid #fff}
.car::before{left:8px}.car::after{right:8px}
.car.q{background:var(--paper);color:var(--ink);border:4px dashed var(--ink)}
.jump{font-family:var(--f-big);font-size:18px;font-weight:600;color:var(--gold-deep);align-self:center;margin-bottom:16px}
.pat{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}
.sep{width:4px;height:56px;background:var(--gold);border-radius:2px}
.qbox{width:56px;height:56px;border:4px dashed var(--ink);border-radius:12px;display:grid;place-items:center;font-family:var(--f-big);font-size:32px;font-weight:700}
.nlwrap{max-width:100%;display:flex;flex-direction:column;align-items:center;gap:6px}
.nl{display:flex;gap:2px;overflow-x:auto;max-width:100%;padding:6px}
.nl i{min-width:28px;text-align:center;font-style:normal;font-family:var(--f-big);font-size:16px;border-top:4px solid var(--ink);padding-top:4px}
.nl i.h{background:var(--gold);border-radius:0 0 6px 6px;font-weight:700}

/* money, sticks, plates, scale */
.money{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:center;max-width:680px}
.coin{width:62px;height:62px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FAFAFA,#B5BBC4);border:3px solid #8A909A;display:grid;place-items:center;font-family:var(--f-big);font-weight:700;font-size:26px;color:#363C4A}
.note{width:108px;height:56px;border-radius:8px;display:grid;place-items:center;font-family:var(--f-big);font-weight:700;font-size:28px;color:#fff;border:3px solid rgba(0,0,0,.2)}
.note.n5{background:#9A6A3C}.note.n10{background:#3E8E5A}
.money-btn{padding:8px;border-radius:18px;background:var(--soft);box-shadow:0 4px 0 var(--line)}
.money-btn:active{transform:translateY(3px)}
.shop{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%}
.item{font-size:76px;line-height:1}
.paid{min-height:76px;border:4px dashed var(--line);border-radius:18px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;width:min(560px,100%);box-sizing:border-box}
.tray{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.plate{width:132px;height:132px;border-radius:50%;background:#fff;border:5px solid var(--line);display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:1px;padding:14px;box-sizing:border-box;line-height:1}
.pan{min-width:130px;padding:14px 18px;border-radius:0 0 70px 70px;background:var(--soft);border:4px solid var(--ink);border-top-width:9px;font-family:var(--f-big);font-size:44px;font-weight:700;text-align:center;white-space:nowrap}

/* cards */
.reveal{display:flex;gap:24px;flex-wrap:wrap;justify-content:center;align-items:center;width:100%}
.reveal>.scene{width:min(440px,90vw)}
.card{width:min(270px,72vw);aspect-ratio:3/4;box-sizing:border-box;border-radius:22px;background:var(--paper);border:8px solid var(--c);box-shadow:0 12px 0 rgba(29,41,68,.15);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:12px;text-align:center;gap:6px;animation:flip .9s both}
.card .ic{font-size:100px;line-height:1;flex:1;display:grid;place-items:center;width:100%}
.card .ic svg{height:1.4em}
.card .ic .scene svg{height:100%}
.card .nm{font-family:var(--f-big);font-weight:700;font-size:25px;line-height:1.1}
.card .st{font-size:15px;color:var(--ink-soft)}
.card.goldc{background:linear-gradient(160deg,#FFF3CF,var(--paper) 60%)}
@keyframes flip{from{transform:perspective(900px) rotateY(180deg) scale(.6);opacity:0}to{transform:none;opacity:1}}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:12px}
.slot{aspect-ratio:3/4;box-sizing:border-box;border-radius:14px;background:var(--paper);border:4px solid var(--c);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px;text-align:center;font-size:13px;line-height:1.15;min-width:0}
.slot.locked{border-style:dashed;border-color:var(--line);color:var(--ink-soft);font-family:var(--f-big);font-size:34px;background:var(--soft)}
.slot .ic{font-size:46px;line-height:1;width:100%;display:grid;place-items:center}
.slot .ic svg{height:1.2em}
.slot .ic .scene{border-radius:8px}
.slot .ic .scene svg{height:100%}
.slot.goldslot{border-color:var(--gold);background:#FFF6DC}

/* pick + city */
.picks{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;width:100%;max-width:900px}
.pick{background:var(--paper);border:5px solid var(--c);border-radius:24px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 6px 0 rgba(29,41,68,.12)}
.pick .ic{font-size:70px;line-height:1;height:80px;display:grid;place-items:center}
.pick .ic svg{height:1.1em}
.pick b{font-family:var(--f-big);font-size:26px;color:var(--c)}
.city{display:grid;grid-template-columns:1fr 1fr;gap:14px;background:var(--sand);border-radius:26px;padding:14px;border:6px solid #CDB88C}
@media (max-width:560px){.city{grid-template-columns:1fr}}
.plot{border-radius:18px;overflow:hidden;background:rgba(255,255,255,.4);border:3px dashed rgba(29,41,68,.22);display:flex;flex-direction:column;min-width:0}
.plot .cap{font-family:var(--f-big);font-size:19px;font-weight:600;padding:6px 12px}
.plot .scene{border-radius:0}
.plot .empty{aspect-ratio:3/2;display:grid;place-items:center;font-family:var(--f-big);font-size:44px;color:var(--ink-soft)}
.decos{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;font-size:36px;justify-content:center;padding:4px}
.earned{font-family:var(--f-big);font-size:clamp(64px,12vw,120px);font-weight:700;color:var(--gold-deep);line-height:1}

/* grown-ups */
.gate input{font-family:var(--f-big);font-size:34px;width:150px;text-align:center;border:3px solid var(--line);border-radius:14px;padding:8px;background:var(--paper);color:var(--ink)}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{padding:10px 20px;border-radius:999px;background:var(--paper);border:3px solid var(--c);font-family:var(--f-big);font-weight:600;font-size:19px;color:var(--c)}
.tab[aria-pressed="true"]{background:var(--c);color:#fff}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.stat{background:var(--soft);border-radius:16px;padding:10px 12px;font-size:15px;color:var(--ink-soft)}
.stat b{display:block;font-family:var(--f-big);font-size:30px;color:var(--ink);font-variant-numeric:tabular-nums}
.strand{display:flex;flex-direction:column;gap:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:15px;font-style:normal;padding:5px 11px;border-radius:999px;border:2px solid var(--line);background:var(--paper);color:var(--ink)}
.chip.m{background:var(--good);border-color:var(--good);color:#fff}
.chip.l{background:#FFF1CC;border-color:var(--gold)}
.legend{display:flex;gap:6px;flex-wrap:wrap}
select{font:inherit;font-size:17px;padding:10px;border-radius:12px;border:3px solid var(--line);background:var(--paper);color:var(--ink);max-width:100%}

.conf{position:fixed;top:-40px;font-size:30px;animation:fall 2.4s linear forwards;pointer-events:none;z-index:50}
@keyframes fall{to{transform:translateY(112vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}.conf{display:none}}
</style>
<style>
[hidden]{display:none!important}
img{max-width:100%}
#app{padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:calc(22px + env(safe-area-inset-bottom,0px))}
.code{font-family:var(--f-big);font-size:22px;letter-spacing:1px;width:230px;max-width:100%;text-transform:uppercase;border:3px solid var(--line);border-radius:14px;padding:10px;background:var(--paper);color:var(--ink)}
</style>
</head>
<body>
<main id="app"></main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="app.js"></script>
</body>
</html>
